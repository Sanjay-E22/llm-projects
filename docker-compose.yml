version: "3.9"

services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore
      - ./models:/app/models

    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434


  frontend:

    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend